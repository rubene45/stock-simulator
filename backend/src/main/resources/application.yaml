spring:
  application:
    name: stock-simulator

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stocks}
    username: ${DATABASE_USERNAME:stocks_user}
    password: ${DATABASE_PASSWORD:stocks_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
