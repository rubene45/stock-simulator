<main class="register-page">
  <div class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-5">
    <section class="register-card">
      <a routerLink="/" class="back-link">← Volver al inicio</a>
      <p class="eyebrow mt-4">TU PRÓXIMO MOVIMIENTO</p><h1 class="h2 fw-bold">Crea tu cuenta</h1><p class="text-secondary">Entra en la economía de Proyecto Stocks.</p>
      <form class="mt-4" (submit)="submit($event)">
        <label class="form-label" for="username">Nombre de usuario</label><input class="form-control form-control-lg mb-3" id="username" name="username" [(ngModel)]="username" required minlength="3" maxlength="32" autocomplete="username">
        <label class="form-label" for="email">Correo electrónico</label><input class="form-control form-control-lg mb-3" id="email" name="email" type="email" [(ngModel)]="email" required maxlength="254" autocomplete="email">
        <label class="form-label" for="password">Contraseña</label><input class="form-control form-control-lg mb-3" id="password" name="password" type="password" [(ngModel)]="password" required minlength="8" maxlength="72" autocomplete="new-password">
        <label class="form-label" for="confirmPassword">Repite la contraseña</label><input class="form-control form-control-lg mb-4" id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required autocomplete="new-password">
        <button class="btn btn-success btn-lg w-100 rounded-pill" [disabled]="loading()">{{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}</button>
      </form>
      @if (error()) { <div class="alert alert-danger mt-3 mb-0" role="alert">{{ error() }}</div> }
      @if (success()) { <div class="alert alert-success mt-3 mb-0" role="status">{{ success() }}</div> }
    </section>
  </div></div></div>
</main>
